{{ with .Site.Params.banner }}
  {{ if .enable }}
  {{ "<!-- Site Hero Start -->" | safeHTML }}
  <section class="site-hero" style="background-image: url('{{ .background_image }}');">
    {{ with .background_video }}
    <video class="site-hero-video" autoplay muted loop playsinline preload="metadata"
           poster="{{ $.Site.Params.banner.video_poster | default "/images/backgrounds/hero-poster.jpg" | relURL }}"
           aria-hidden="true">
      <source src="{{ replace . ".mp4" ".webm" | relURL }}" type="video/webm">
      <source src="{{ . | relURL }}" type="video/mp4">
    </video>
    {{ end }}
    <div class="container">
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <div class="site-hero-content text-center">
            <h6>{{ lang.Translate "banner_tagline" }}</h6>
            <h1>
              {{ lang.Translate "banner_heading" }}
            </h1>
            <div class="site-hero-cta">
              <button type="button" class="btn btn-hero-video" id="openHeroVideoModal" aria-haspopup="dialog" aria-controls="heroVideoModal">
                {{ lang.Translate "banner_watch_video" | default "▶ Ver video institucional" }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <a href="#counter" class="site-hero-scroll scroll-to">
      <img src="{{ "images/arrow-down.svg" | absURL }}" alt="arrow-down">
    </a>
  </section>

  <!-- Hero Video Modal -->
  <div class="hero-video-modal" id="heroVideoModal" role="dialog" aria-modal="true" aria-label="Video institucional" hidden>
    <div class="hero-video-modal-backdrop" id="heroVideoModalBackdrop"></div>
    <div class="hero-video-modal-dialog">
      <button type="button" class="hero-video-modal-close" id="closeHeroVideoModal" aria-label="Cerrar video">&times;</button>
      <div class="hero-video-modal-body">
        <video id="heroInstitutionalVideo" controls playsinline preload="none"
               poster="{{ "/images/backgrounds/institucional-poster.jpg" | relURL }}">
          <source src="{{ "/videos/institucional.webm" | relURL }}" type="video/webm">
          <source src="{{ "/videos/institucional.mp4" | relURL }}" type="video/mp4">
          Tu navegador no soporta reproducción de video.
        </video>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const modal = document.getElementById('heroVideoModal');
      const openBtn = document.getElementById('openHeroVideoModal');
      const closeBtn = document.getElementById('closeHeroVideoModal');
      const backdrop = document.getElementById('heroVideoModalBackdrop');
      const video = document.getElementById('heroInstitutionalVideo');

      if (!modal || !openBtn || !video) return;

      function openModal() {
        modal.removeAttribute('hidden');
        document.body.classList.add('hero-video-modal-open');
        video.play().catch(function() {
          // Autoplay with sound might be blocked until user interacts, but clicking the button counts as interaction in modern browsers
        });
        if (closeBtn) closeBtn.focus();
      }

      function closeModal() {
        video.pause();
        modal.setAttribute('hidden', '');
        document.body.classList.remove('hero-video-modal-open');
        if (openBtn) openBtn.focus();
      }

      openBtn.addEventListener('click', openModal);
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (backdrop) backdrop.addEventListener('click', closeModal);

      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !modal.hasAttribute('hidden')) {
          closeModal();
        }
      });
    })();
  </script>
  {{ "<!-- Site Hero End -->" | safeHTML }}
  {{ end }}
{{ end }}
